<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Local recruitment cycle</title><desc id="desc">Scout, hive, and forager robots exchange local information to allocate effort to food sources.</desc>
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#64748b"/></marker><filter id="ds"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs>
  <rect width="1400" height="820" rx="28" fill="#f8fafc"/>
  <text x="700" y="64" text-anchor="middle" fill="#0f2744" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700">Local Recruitment and Collective Foraging</text>
  <text x="700" y="98" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="18">Information moves locally; coordinated work emerges globally</text>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#ar)"><path d="M344 286C470 125 594 145 660 218"/><path d="M760 218c80-76 207-87 322 64"/><path d="M1134 370c35 133-53 230-173 273"/><path d="M437 634c-137-62-201-154-155-270"/><path d="M375 336c125 84 254 95 355 45" stroke-dasharray="9 9"/><path d="M1025 340c-127 91-232 96-327 41" stroke-dasharray="9 9"/></g>
  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(155 210)"><circle cx="125" cy="125" r="125" fill="#fff3d6" stroke="#f59e0b" stroke-width="4"/><text x="125" y="105" text-anchor="middle" fill="#92400e" font-size="27" font-weight="700">SCOUT</text><text x="125" y="140" text-anchor="middle" fill="#b45309" font-size="17">explore + discover</text><text x="125" y="168" text-anchor="middle" fill="#b45309" font-size="17">estimate source value</text></g>
    <g transform="translate(575 150)"><circle cx="125" cy="125" r="125" fill="#f0eaff" stroke="#8b5cf6" stroke-width="4"/><text x="125" y="105" text-anchor="middle" fill="#5b21b6" font-size="27" font-weight="700">HIVE</text><text x="125" y="140" text-anchor="middle" fill="#6d28d9" font-size="17">receive local reports</text><text x="125" y="168" text-anchor="middle" fill="#6d28d9" font-size="17">allocate foragers</text></g>
    <g transform="translate(995 210)"><circle cx="125" cy="125" r="125" fill="#e4efff" stroke="#3b82f6" stroke-width="4"/><text x="125" y="105" text-anchor="middle" fill="#1e40af" font-size="27" font-weight="700">FORAGER</text><text x="125" y="140" text-anchor="middle" fill="#1d4ed8" font-size="17">follow source cue</text><text x="125" y="168" text-anchor="middle" fill="#1d4ed8" font-size="17">collect + return</text></g>
    <g transform="translate(450 590)"><rect width="500" height="150" rx="75" fill="#daf8ef" stroke="#14b8a6" stroke-width="4"/><text x="250" y="62" text-anchor="middle" fill="#115e59" font-size="27" font-weight="700">FOOD SOURCE + NEST</text><text x="250" y="98" text-anchor="middle" fill="#0f766e" font-size="17">environmental feedback updates recruitment</text></g>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#475569"><text x="480" y="168" text-anchor="middle">POSITION + QUALITY</text><text x="923" y="168" text-anchor="middle">RECRUITMENT MESSAGE</text><text x="1165" y="510">FOOD</text><text x="700" y="566" text-anchor="middle" fill="#0f766e">PICKUP · DELIVERY · DEPLETION</text><text x="270" y="520">NEW SEARCH</text><text x="540" y="370" text-anchor="middle">LOCAL BROADCAST</text><text x="863" y="370" text-anchor="middle">ROBOT STATUS</text></g>
  <text x="700" y="785" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="16">Resting robots remain inactive until useful work is available, reducing unnecessary movement.</text>
</svg>
