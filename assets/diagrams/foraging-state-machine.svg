<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Foot-bot foraging state machine</title><desc id="desc">Detailed operational flow from resting through exploration, food collection, return, deposit, and recovery.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#64748b"/></marker><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="1000" rx="28" fill="#f8fafc"/>
  <text x="800" y="64" text-anchor="middle" fill="#0f2744" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700">Foot-bot Foraging State Machine</text>
  <text x="800" y="100" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="18">Modern reconstruction from the Persian thesis figures and controller source</text>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M318 240H465"/><path d="M665 240H810"/><path d="M1010 240h145"/><path d="M1255 305v125"/><path d="M1155 515h-145"/><path d="M810 515H665"/><path d="M465 515H320"/><path d="M220 430V305"/><path d="M565 305v125"/><path d="M910 305v125"/><path d="M220 650c0 155 440 214 683 67"/><path d="M1255 650c0 156-199 230-345 125"/></g>
  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(120 175)"><rect width="200" height="130" rx="26" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="100" y="55" text-anchor="middle" fill="#5b21b6" font-size="23" font-weight="700">RESTING</text><text x="100" y="85" text-anchor="middle" fill="#7c3aed" font-size="16">inactive in nest</text></g>
    <g transform="translate(465 175)"><rect width="200" height="130" rx="26" fill="#fff7df" stroke="#f59e0b" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#92400e" font-size="22" font-weight="700">LEAVING HOME</text><text x="100" y="84" text-anchor="middle" fill="#b45309" font-size="16">enter search area</text></g>
    <g transform="translate(810 175)"><rect width="200" height="130" rx="26" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#075985" font-size="22" font-weight="700">RANDOM WALK</text><text x="100" y="84" text-anchor="middle" fill="#0369a1" font-size="16">distributed search</text></g>
    <g transform="translate(1155 175)"><rect width="200" height="130" rx="26" fill="#dffaf3" stroke="#14b8a6" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#115e59" font-size="22" font-weight="700">SCAN AREA</text><text x="100" y="84" text-anchor="middle" fill="#0f766e" font-size="16">inspect source</text></g>
    <g transform="translate(1155 430)"><rect width="200" height="130" rx="26" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">GRAB FOOD</text><text x="100" y="84" text-anchor="middle" fill="#15803d" font-size="16">one item per robot</text></g>
    <g transform="translate(810 430)"><rect width="200" height="130" rx="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#1e40af" font-size="21" font-weight="700">MOVE HOME</text><text x="100" y="84" text-anchor="middle" fill="#1d4ed8" font-size="16">successful return</text></g>
    <g transform="translate(465 430)"><rect width="200" height="130" rx="26" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="700">DEPOSIT FOOD</text><text x="100" y="84" text-anchor="middle" fill="#c2410c" font-size="16">update collection</text></g>
    <g transform="translate(120 430)"><rect width="200" height="130" rx="26" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="100" y="53" text-anchor="middle" fill="#991b1b" font-size="21" font-weight="700">HOMING</text><text x="100" y="84" text-anchor="middle" fill="#b91c1c" font-size="16">unsuccessful return</text></g>
    <g transform="translate(650 705)"><rect width="300" height="120" rx="60" fill="#0f2744" stroke="#60a5fa" stroke-width="3"/><text x="150" y="51" text-anchor="middle" fill="white" font-size="22" font-weight="700">COLLISION AVOIDANCE</text><text x="150" y="81" text-anchor="middle" fill="#b9d6ee" font-size="16">temporary interrupt → resume task</text></g>
  </g>
  <g font-family="DejaVu Sans, sans-serif" fill="#475569" font-size="15" font-weight="700"><text x="392" y="226" text-anchor="middle">ACTIVATE</text><text x="737" y="226" text-anchor="middle">OUTSIDE NEST</text><text x="1083" y="226" text-anchor="middle">SOURCE CUE</text><text x="1280" y="370">FOOD FOUND</text><text x="1082" y="500" text-anchor="middle">COLLECTED</text><text x="738" y="500" text-anchor="middle">REACH NEST</text><text x="392" y="500" text-anchor="middle">EMPTY / DONE</text><text x="183" y="369" text-anchor="middle">REST</text><text x="585" y="370">RECRUITED</text><text x="930" y="370">NO FOOD</text></g>
  <rect x="110" y="885" width="1380" height="62" rx="18" fill="#e9f1f8"/><text x="800" y="924" text-anchor="middle" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="17">High-level controller modes: RESTING · EXPLORING · RETURN TO NEST · TURNING</text>
</svg>
