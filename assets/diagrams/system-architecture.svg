<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Swarm foraging system architecture</title><desc id="desc">ARGoS sensors feed local controllers that coordinate scout, hive, and forager roles while loop functions manage food and metrics.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#62748a"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="760" rx="28" fill="#f8fafc"/>
  <text x="700" y="62" text-anchor="middle" fill="#0f2744" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700">Distributed Swarm-Foraging Architecture</text>
  <text x="700" y="96" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="18">Sense locally · decide autonomously · coordinate through neighbourhood communication</text>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="70" y="160" width="290" height="470" rx="24" fill="#e9f5ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="215" y="205" text-anchor="middle" fill="#1d4ed8" font-size="24" font-weight="700">Foot-bot Interfaces</text>
    <g fill="white" stroke="#bfdbfe"><rect x="105" y="245" width="220" height="58" rx="14"/><rect x="105" y="321" width="220" height="58" rx="14"/><rect x="105" y="397" width="220" height="58" rx="14"/><rect x="105" y="473" width="220" height="58" rx="14"/><rect x="105" y="549" width="220" height="58" rx="14"/></g>
    <g fill="#173b62" text-anchor="middle" font-size="18" font-weight="600"><text x="215" y="281">Proximity sensors</text><text x="215" y="357">Motor-ground sensors</text><text x="215" y="433">Light sensors</text><text x="215" y="509">Range &amp; bearing</text><text x="215" y="585">Wheels + LEDs</text></g>
    <rect x="475" y="160" width="450" height="470" rx="24" fill="#eefcf8" stroke="#14b8a6" stroke-width="2"/>
    <text x="700" y="205" text-anchor="middle" fill="#0f766e" font-size="24" font-weight="700">Local Foot-bot Controller</text>
    <rect x="520" y="245" width="360" height="78" rx="16" fill="white" stroke="#99f6e4"/><text x="700" y="278" text-anchor="middle" fill="#115e59" font-size="19" font-weight="700">Finite-state behaviour</text><text x="700" y="304" text-anchor="middle" fill="#64748b" font-size="15">rest · explore · return · avoid</text>
    <g><rect x="520" y="348" width="106" height="86" rx="16" fill="#fff1d6" stroke="#f59e0b"/><rect x="647" y="348" width="106" height="86" rx="16" fill="#f1eafe" stroke="#8b5cf6"/><rect x="774" y="348" width="106" height="86" rx="16" fill="#e6f1ff" stroke="#3b82f6"/></g>
    <g text-anchor="middle" font-size="17" font-weight="700"><text x="573" y="386" fill="#92400e">SCOUT</text><text x="573" y="410" fill="#92400e" font-size="14">discover</text><text x="700" y="386" fill="#6d28d9">HIVE</text><text x="700" y="410" fill="#6d28d9" font-size="14">allocate</text><text x="827" y="386" fill="#1d4ed8">FORAGER</text><text x="827" y="410" fill="#1d4ed8" font-size="14">collect</text></g>
    <rect x="520" y="470" width="360" height="118" rx="16" fill="#0f2744"/><text x="700" y="507" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Local decision + recruitment</text><text x="700" y="538" text-anchor="middle" fill="#b9d6ee" font-size="15">food position · food value · robot status</text><text x="700" y="563" text-anchor="middle" fill="#b9d6ee" font-size="15">probabilistic activation · collision response</text>
    <rect x="1040" y="160" width="290" height="470" rx="24" fill="#fff8e8" stroke="#f59e0b" stroke-width="2"/>
    <text x="1185" y="205" text-anchor="middle" fill="#b45309" font-size="24" font-weight="700">ARGoS World</text>
    <g fill="white" stroke="#fde68a"><rect x="1075" y="245" width="220" height="70" rx="14"/><rect x="1075" y="337" width="220" height="70" rx="14"/><rect x="1075" y="429" width="220" height="70" rx="14"/><rect x="1075" y="521" width="220" height="86" rx="14"/></g>
    <g fill="#713f12" text-anchor="middle"><text x="1185" y="276" font-size="18" font-weight="700">Arena + nest</text><text x="1185" y="296" font-size="14">walls and floor regions</text><text x="1185" y="368" font-size="18" font-weight="700">Food sources</text><text x="1185" y="388" font-size="14">position and quantity</text><text x="1185" y="460" font-size="18" font-weight="700">Loop functions</text><text x="1185" y="480" font-size="14">pickup and deposit</text><text x="1185" y="551" font-size="18" font-weight="700">Experiment metrics</text><text x="1185" y="576" font-size="14">food · activity · energy</text></g>
  </g>
  <g fill="none" stroke="#62748a" stroke-width="3" marker-end="url(#arrow)"><path d="M360 315H465"/><path d="M925 315h105"/><path d="M1040 480H935"/><path d="M475 525H370"/></g>
  <g font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#475569"><text x="412" y="300" text-anchor="middle">READINGS</text><text x="978" y="300" text-anchor="middle">ACTIONS</text><text x="980" y="464" text-anchor="middle">EVENTS</text><text x="422" y="510" text-anchor="middle">FEEDBACK</text></g>
</svg>
